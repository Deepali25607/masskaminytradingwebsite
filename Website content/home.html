<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maa Kaminy Trading - Revolutionizing Agri-Supply Chain</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="Logo.png" type="image/png" sizes="32x32">

    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        </style>
        </head>
        
<body class="text-gray-800">

    <!-- Header Section -->
    <header class="bg-white shadow-sm py-4 px-6 md:px-12 sticky top-0 z-50">
        <nav class="flex justify-between items-center max-w-7xl mx-auto">
            <!-- Logo -->
          <div class="flex items-center space-x-2">
            <img src="Logo.png" alt="logo" class="h-8 w-8 text-green-600">
        
            <div class="flex flex-col">
                <span class="text-2xl font-bold text-green-700">Maa Kaminy Trading</span>
                <span class="text-sm text-gray-600">Dhulagarh</span>
            </div>
        </div>

            <!-- Navigation Links (Hidden on mobile, shown on larger screens) -->
            <div class="hidden md:flex space-x-8">
                <a href="#home" class="text-gray-600 hover:text-green-600 font-medium transition duration-300">Home</a>
                <a href="#about" class="text-gray-600 hover:text-green-600 font-medium transition duration-300">About
                    Us</a>
                <a href="#services"
                    class="text-gray-600 hover:text-green-600 font-medium transition duration-300">Services</a>
                <a href="#benefits"
                    class="text-gray-600 hover:text-green-600 font-medium transition duration-300">Benefits</a>
               
                <a href="#contact"
                    class="text-gray-600 hover:text-green-600 font-medium transition duration-300">Contact</a>
            </div>

            <!-- Mobile Menu Button (Hamburger Icon) -->
            <button id="mobile-menu-button"
                class="md:hidden p-2 rounded-md text-gray-600 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-green-500">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </nav>

        <!-- Mobile Menu (Hidden by default) -->
        <div id="mobile-menu" class="hidden md:hidden mt-4 space-y-2">
            <a href="#home" class="block px-4 py-2 text-gray-700 hover:bg-gray-50 rounded-md">Home</a>
            <a href="#about" class="block px-4 py-2 text-gray-700 hover:bg-gray-50 rounded-md">About Us</a>
            <a href="#services" class="block px-4 py-2 text-gray-700 hover:bg-gray-50 rounded-md">Services</a>
            <a href="#benefits" class="block px-4 py-2 text-gray-700 hover:bg-gray-50 rounded-md">Benefits</a>
           
            <a href="#contact" class="block px-4 py-2 text-gray-700 hover:bg-gray-50 rounded-md">Contact</a>
        </div>
         <script>
        const menuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        const menuLinks = document.querySelectorAll("#mobile-menu a");

        // Toggle menu on button click
        menuButton.addEventListener('click', (e) => {
            e.stopPropagation(); // click bubble na ho
            mobileMenu.classList.toggle('hidden');
        });

        // Click on link → highlight + close menu
        menuLinks.forEach(link => {
            link.addEventListener("click", function () {
                // remove old active
                menuLinks.forEach(l => l.classList.remove("bg-green-500", "text-white"));
                // add active to clicked
                this.classList.add("bg-green-500", "text-white");
                // close menu
                mobileMenu.classList.add("hidden");
            });
        });

        // Outside click → close menu
        document.addEventListener('click', (e) => {
            if (!mobileMenu.classList.contains('hidden') &&
                !mobileMenu.contains(e.target) &&
                !menuButton.contains(e.target)) {
                mobileMenu.classList.add('hidden');
            }
        });
    </script>
    </header>
    </body>
</html>
